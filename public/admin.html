<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | ProEduvate Employee Tracker</title>
  <link rel="stylesheet" href="admin.css" />
  <style>
    body {
      background: #f4f7fb;
      font-family: "Poppins", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: #fff;
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 360px;
      text-align: center;
    }
    .login-container h2 {
      margin-bottom: 30px;
      color: #2d3e50;
      font-weight: 600;
    }
    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      font-size: 14px;
      color: #555;
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    input:focus {
      border-color: #4a90e2;
      outline: none;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4a90e2;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.3s ease;
    }
    .login-btn:hover {
      background: #357abd;
    }
    .footer-text {
      font-size: 13px;
      margin-top: 20px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Admin Login</h2>
    <form id="adminLoginForm">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter admin username" required />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter admin password" required />
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
    <p class="footer-text">© 2025 ProEduvate | Admin Access Only</p>
  </div>

  <script src="admin.js"></script>
</body>
</html>

<script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const loading = document.getElementById('loading');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');

    // 🟢 Update this to your actual backend URL on Render
    const BACKEND_URL = "https://employee-tracker-vgqx.onrender.com";

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
        loading.style.display = 'block';
        errorMessage.style.display = 'none';

        try {
            const response = await fetch(`${BACKEND_URL}/api/admin/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, password }),
                credentials: 'include'
            });

            const data = await response.json();

            if (response.ok) {
                window.location.href = `${BACKEND_URL}/admin`;
            } else {
                errorText.textContent = data.message || 'Invalid credentials. Please try again.';
                errorMessage.style.display = 'block';
            }
        } catch (error) {
            console.error('Login error:', error);
            errorText.textContent = 'Connection error. Please try again.';
            errorMessage.style.display = 'block';
        } finally {
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Dashboard';
            loading.style.display = 'none';
        }
    });

    document.getElementById('username').addEventListener('input', () => {
        errorMessage.style.display = 'none';
    });

    document.getElementById('password').addEventListener('input', () => {
        errorMessage.style.display = 'none';
    });
</script>
